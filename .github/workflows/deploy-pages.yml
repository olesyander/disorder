name: Deploy research map
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [research-map-verified]

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
      page_url: ${{ steps.pages.outputs.base_url }}
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4

      - name: Validate graph and prepare site
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_site.py --root .
          required=(index.html style.css site-config.js app.js knowledge.js catalog.json knowledge.json)
          mkdir -p _site
          cp "${required[@]}" _site/
          touch _site/.nojekyll
          if [[ -d papers ]]; then cp -a papers _site/papers; fi
          # Only the date is published; technical commit messages are not shown.
          python - <<'PYTHON'
          import hashlib, json, pathlib, re, subprocess

          site = pathlib.Path('_site')
          index = site / 'index.html'

          def version_asset(match):
              name = match['name']
              digest = hashlib.sha256((site / name).read_bytes()).hexdigest()[:12]
              return f'{match["attr"]}="./{name}?v={digest}"'

          assets = r'\b(?P<attr>src|href)="\./(?P<name>[\w.-]+\.(?:css|js))(?:\?[^"]*)?"'
          index.write_text(re.sub(assets, version_asset, index.read_text(encoding='utf-8')), encoding='utf-8')

          date = subprocess.check_output(['git', 'log', '-1', '--format=%cI'], text=True).strip()
          (site / 'release.json').write_text(
              json.dumps({'date': date}, ensure_ascii=False), encoding='utf-8')
          PYTHON

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload prepared site
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check upload receipt
        if: ${{ steps.upload.outputs.artifact_id == '' }}
        run: |
          echo "::error::Upload prepared site returned no artifact ID. Re-run the build to upload the site again."
          exit 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ needs.build.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        with:
          script: |
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId < 1) {
              throw new Error('Upload prepared site did not return an artifact ID. See the build job.');
            }
            core.info(`Deploying artifact ${artifactId} for commit ${context.sha}.`);
            const {data} = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo,
              artifact_id: artifactId,
              pages_build_version: context.sha,
              oidc_token: await core.getIDToken()
            });
            core.setOutput('deployment_id', data.id || context.sha);

      - name: Wait for publication
        id: publication
        uses: actions/github-script@v8
        timeout-minutes: 12
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        with:
          retries: 3
          retry-exempt-status-codes: 400,401,403,422,451
          script: |
            const target = {...context.repo, pages_deployment_id: process.env.DEPLOYMENT_ID};
            const failures = new Set(['deployment_failed', 'deployment_content_failed',
              'deployment_cancelled', 'deployment_attempt_error', 'deployment_lost', 'unknown_status']);
            const deadline = Date.now() + 10 * 60 * 1000;
            let previous;
            while (Date.now() < deadline) {
              const {data: {status}} = await github.request(
                'GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', target);
              if (status !== previous) core.info(`Pages deployment ${target.pages_deployment_id}: ${status}`);
              previous = status;
              if (status === 'succeed' || failures.has(status)) {
                core.setOutput('finished', 'true');
                if (status === 'succeed') return;
                throw new Error(`Pages reported ${status}.`);
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Pages did not confirm publication within 10 minutes.');

      - name: Cancel unfinished publication
        if: ${{ (failure() || cancelled()) && steps.deployment.outputs.deployment_id != '' && steps.publication.outputs.finished != 'true' }}
        uses: actions/github-script@v8
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        with:
          script: |
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', {
              ...context.repo, pages_deployment_id: process.env.DEPLOYMENT_ID
            });
