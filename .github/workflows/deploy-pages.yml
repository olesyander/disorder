name: Deploy research map
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4

      - name: Validate graph and prepare site
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_site.py --root .
          required=(index.html style.css site-config.js app.js knowledge.js catalog.json knowledge.json)
          mkdir -p _site
          cp "${required[@]}" _site/
          touch _site/.nojekyll
          if [[ -d papers ]]; then cp -a papers _site/papers; fi
          # Only the date is published; technical commit messages are not shown.
          python - <<'PYTHON'
          import json, pathlib, subprocess
          date = subprocess.check_output(['git', 'log', '-1', '--format=%cI'], text=True).strip()
          pathlib.Path('_site/release.json').write_text(
              json.dumps({'date': date}, ensure_ascii=False), encoding='utf-8')
          PYTHON

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload prepared site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
