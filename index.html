<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071424">
  <meta name="description" content="An interactive map of scientific literature.">
  <title>disorder map</title>
  <link rel="stylesheet" href="./style.css?v=v3.3-knowledge">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand" id="brand">Research <span>map</span></div>
      <nav class="view-tabs" role="tablist" aria-label="Map view">
        <button class="view-tab active" id="tab-library" type="button" role="tab" aria-selected="true" aria-controls="canvas">Library</button>
        <button class="view-tab" id="tab-knowledge" type="button" role="tab" aria-selected="false" aria-controls="knowledge-view">Knowledge Graph</button>
      </nav>
      <div class="actions">
        <div class="search-wrap">
          <label class="sr-only" for="search-input">Search publications by title or author</label>
          <input type="search" id="search-input" class="search-input"
            placeholder="Search title or author…" aria-label="Search title or author"
            aria-controls="search-results" aria-expanded="false" autocomplete="off" spellcheck="false">
          <div id="search-results" class="search-results" role="listbox" aria-label="Matching publications" hidden></div>
        </div>
        <button type="button" class="action" id="expand" aria-label="Expand all folders">Expand all</button>
        <button type="button" class="action" id="collapse" aria-label="Collapse all folders">Collapse all</button>
      </div>
    </header>
    <main class="canvas" id="canvas" aria-label="Interactive library tree">
      <svg id="map" role="img" aria-label="Topic folders and publications. Click folders to expand and articles to read their details."></svg>
      <div id="message" class="message" hidden></div>
    </main>
    <section id="knowledge-view" class="knowledge-view" aria-label="Publication relationships" hidden>
      <div class="knowledge-controls">
        <div class="knowledge-filters">
          <label><input type="checkbox" id="kg-citation" checked> Citations</label>
          <label><input type="checkbox" id="kg-author" checked> Shared authors</label>
          <label><input type="checkbox" id="kg-similar" checked> Similar text</label>
          <label><input type="checkbox" id="kg-manual" checked> Curated</label>
          <label><input type="checkbox" id="kg-isolated" checked> Isolated papers</label>
        </div>
        <div class="knowledge-strength">
          <label for="kg-min">Minimum strength <output id="kg-min-value">0.20</output></label>
          <input type="range" id="kg-min" min="0.15" max="0.90" step="0.05" value="0.20">
        </div>
        <p id="knowledge-status" class="knowledge-status" role="status">Knowledge graph</p>
      </div>
      <svg id="knowledge-svg" aria-label="Knowledge graph of publications" role="img"></svg>
    </section>
    <details class="release" id="release" aria-label="Latest update">
      <summary id="update-summary">Latest update</summary>
      <div id="update-changes" class="release-content"></div>
    </details>
    <div id="overlay" class="overlay" aria-hidden="true"></div>
    <aside class="drawer" id="drawer" aria-label="Publication details" aria-hidden="true">
      <div class="drawer-header">
        <span id="type-label" class="tag">ARTICLE</span>
        <button id="close" class="close" type="button" aria-label="Close details">×</button>
      </div>
      <div class="drawer-content">
        <h1 id="paper-title"></h1>
        <div class="field-label" id="authors-label">AUTHORS</div>
        <p id="authors"></p>
        <div class="field-label" id="abstract-label">ABSTRACT</div>
        <p id="abstract"></p>
        <div id="access" class="access"></div>
        <div id="external" class="external"></div>
      </div>
    </aside>
  </div>
  <script defer src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script defer src="./app.js?v=v3.3-knowledge"></script>
  <script defer src="./knowledge.js?v=v3.3-knowledge"></script>
</body>
</html>
