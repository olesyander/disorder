<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="">
  <meta name="description" content="An interactive map of scientific literature.">
  <title>disorder map</title>
  <link rel="stylesheet" href="./style.css?v=d034b5dbacf9">
</head>

<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand" id="brand">Research <span>map</span></div>
      <label class="view-picker">
        <span class="sr-only">Map view</span>
        <select id="map-view" aria-label="Map view">
          <option value="knowledge">Graph</option>
          <option value="library">Library</option>
        </select>
      </label>
      <div class="actions">
        <div class="search-wrap">
          <label class="sr-only" for="search-input">Search publications by title or author</label>
          <input type="search" id="search-input" class="search-input" placeholder="Search title or author…"
            aria-label="Search title or author" aria-controls="search-results" aria-expanded="false" autocomplete="off"
            spellcheck="false">
          <div id="search-results" class="search-results" role="listbox" aria-label="Matching publications" hidden>
          </div>
        </div>
      </div>
    </header>
    <main class="canvas" id="canvas" aria-label="Interactive library tree" hidden>
      <svg id="map" role="img"
        aria-label="Topic folders and publications. Click folders to expand and articles to read their details."></svg>
      <div id="message" class="message" hidden></div>
    </main>
    <section id="knowledge-view" class="knowledge-view" aria-label="Publication relationships">
      <div class="knowledge-controls">
        <div class="knowledge-filters">
          <label class="kg-option kg-citation"><input type="checkbox" id="kg-citation" checked> Citations</label>
          <label class="kg-option kg-author"><input type="checkbox" id="kg-author" checked> Shared authors</label>
          <label class="kg-option kg-similar"><input type="checkbox" id="kg-similar" checked> Similar text</label>
          <label class="kg-option kg-isolated"><input type="checkbox" id="kg-isolated" checked> Isolated papers</label>
        </div>
        <p id="knowledge-status" class="knowledge-status" role="status">Knowledge graph</p>
      </div>
      <svg id="knowledge-svg" aria-label="Publications grouped by folder" role="group"></svg>
      <div class="zoom-controls" role="group" aria-label="Graph zoom">
        <button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">−</button>
        <button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">+</button>
        <button id="zoom-fit" type="button" title="Fit all folders in view">Fit</button>
      </div>
    </section>
    <!-- Public deployment time only; commit messages are not exposed. -->
    <div class="release" id="release">
      <span class="release-label">Last commit:</span>
      <time id="update-summary">Unavailable</time>
    </div>
    <div id="overlay" class="overlay" aria-hidden="true"></div>
    <aside class="drawer" id="drawer" aria-label="Publication details" aria-hidden="true">
      <div class="drawer-header">
        <span id="type-label" class="tag">ARTICLE</span>
        <button id="close" class="close" type="button" aria-label="Close details">×</button>
      </div>
      <div class="drawer-content">
        <h1 id="paper-title"></h1>
        <div class="field-label" id="authors-label">AUTHORS</div>
        <p id="authors"></p>
        <div class="field-label" id="abstract-label">ABSTRACT</div>
        <p id="abstract"></p>
        <div id="access" class="access"></div>
        <div id="external" class="external"></div>
      </div>
    </aside>
  </div>
  <script defer src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script defer src="./site-config.js?v=11df3bd15c1d"></script>
  <script defer src="./app.js?v=4e48910123d9"></script>
  <script defer src="./knowledge.js?v=212f34f583e4"></script>
</body>

</html>
